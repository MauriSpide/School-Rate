<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Itinerario Canvas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #f6f8ff;
      --surface: rgba(255,255,255,0.88);
      --surface-strong: #ffffff;
      --border: rgba(115,126,160,0.18);
      --text: #171b2b;
      --muted: #6d7690;
      --accent: #7867f5;
      --accent-2: #527bff;
      --accent-3: #54d8e8;
      --success: #5ecb9d;
      --warning: #ffbd69;
      --danger: #ff7d8f;
      --shadow: 0 18px 40px rgba(38,52,88,0.10);
      --shadow-soft: 0 12px 28px rgba(38,52,88,0.06);
      --radius: 22px;
      --nav-h: 84px;
      --hero: linear-gradient(135deg, rgba(120,103,245,0.18), rgba(84,216,232,0.12), rgba(243,138,185,0.10));
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg: #0d1220;
      --surface: rgba(21,27,38,0.86);
      --surface-strong: #171f2d;
      --border: rgba(155,168,195,0.16);
      --text: #edf3ff;
      --muted: #aab8d1;
      --accent: #8e95ff;
      --accent-2: #6da7ff;
      --accent-3: #6fe5ff;
      --success: #82f0ba;
      --warning: #ffc57b;
      --danger: #ff9ba8;
      --shadow: 0 18px 40px rgba(0,0,0,0.35);
      --shadow-soft: 0 12px 28px rgba(0,0,0,0.22);
      --hero: linear-gradient(135deg, rgba(120,103,245,0.20), rgba(84,216,232,0.10), rgba(243,138,185,0.12));
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(120,103,245,0.14), transparent 28rem),
        radial-gradient(circle at bottom right, rgba(84,216,232,0.12), transparent 24rem),
        var(--bg);
      color: var(--text);
      letter-spacing: -0.02em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      min-height: 42px;
      border-radius: 14px;
      cursor: pointer;
      padding: 0 12px;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    button:hover { border-color: rgba(120,103,245,0.35); }
    button:active { transform: scale(.97); }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: white;
      box-shadow: 0 10px 22px rgba(120,103,245,0.20);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .safe-pad { padding-bottom: calc(var(--nav-h) + 20px); }
    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 12px 90px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 12px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(120,103,245,0.14), rgba(84,216,232,0.18));
      border: 1px solid rgba(120,103,245,0.16);
      font-size: 18px;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(1rem, 2.4vw, 1.22rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      width: 40px;
      min-width: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      border-color: transparent;
      border-radius: 12px;
    }
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      width: min(220px, 40vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 10px;
      box-shadow: var(--shadow-soft);
    }
    .search-wrap input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: .95rem;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00)), var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 16px;
      overflow: hidden;
    }
    .card.hero {
      background: var(--hero);
      border-color: rgba(120,103,245,0.12);
      padding: 18px;
    }
    .hero .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .eyebrow {
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--muted);
    }
    .hero h2 {
      margin: 8px 0 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.18);
      font-weight: 800;
      font-size: .8rem;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .84rem;
      margin-top: 8px;
    }
    .progress-wrap {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }
    .progress-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: .92rem;
      color: var(--muted);
    }
    .progress-bar {
      height: 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.32);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-3));
      transition: width .35s ease;
    }
    .mini-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90px;
      gap: 6px;
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
    }
    .stat strong {
      font-size: 1.35rem;
      letter-spacing: -0.05em;
    }
    .subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 10px;
    }
    .subhead h3 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: -0.03em;
    }
    .link-btn {
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--accent);
      font-weight: 800;
    }

    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(0,1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .day-chip {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      min-height: 84px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      padding: 8px 5px;
      text-align: center;
      transition: transform .15s ease, background .15s ease;
    }
    .day-chip.active {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: white;
      box-shadow: 0 12px 22px rgba(120,103,245,0.18);
    }
    .day-chip .label {
      font-size: .72rem;
      text-transform: capitalize;
      opacity: .85;
    }
    .day-chip .date {
      font-size: 1.06rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .dot-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.74);
    }

    .task-list { display: grid; gap: 10px; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
    }
    .task-item.done { opacity: .72; }
    .task-item.done .task-title { text-decoration: line-through; }
    .check {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 50%;
      padding: 0;
      border: 2px solid rgba(120,103,245,0.7);
      display: grid;
      place-items: center;
      color: white;
      font-size: .8rem;
      font-weight: 800;
      background: transparent;
    }
    .task-item.done .check {
      background: linear-gradient(135deg, var(--success), #5ccf9b);
      border-color: transparent;
    }
    .task-main {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 5px;
    }
    .task-title {
      display: block;
      font-weight: 700;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: .74rem;
      color: var(--muted);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: .68rem;
      font-weight: 800;
      border: 1px solid transparent;
      line-height: 1.4;
    }
    .badge.subject { background: rgba(120,103,245,.08); color: var(--accent); }
    .badge.priority.high { background: rgba(255,125,143,.12); color: var(--danger); }
    .badge.priority.medium { background: rgba(255,189,105,.12); color: var(--warning); }
    .badge.priority.low { background: rgba(94,203,157,.12); color: var(--success); }
    .task-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .mini {
      width: 30px;
      min-width: 30px;
      height: 30px;
      min-height: 30px;
      padding: 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .project-card {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
    }
    .project-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .project-header h4 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: -0.03em;
    }
    .project-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(120,103,245,0.4);
    }
    .project-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: .86rem;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
      gap: 12px;
    }
    .note-card {
      position: relative;
      min-height: 150px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(17,17,17,0.06);
      box-shadow: var(--shadow-soft);
      display: grid;
      align-content: start;
      gap: 8px;
      overflow: hidden;
    }
    .note-card::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      right: -26px;
      top: -18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      filter: blur(12px);
    }
    .note-card h4 {
      margin: 0;
      font-size: .92rem;
      position: relative;
      z-index: 1;
    }
    .note-card p {
      margin: 0;
      color: rgba(25,25,25,0.82);
      font-size: .82rem;
      line-height: 1.45;
      position: relative;
      z-index: 1;
    }

    .empty-state {
      width: 100%;
      padding: 24px 18px;
      border-radius: 18px;
      border: 1px dashed var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      text-align: center;
    }

    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 50;
    }
    .nav-inner {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 6px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .nav-item {
      background: transparent;
      border: 0;
      min-height: 58px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      padding: 7px 4px;
    }
    .nav-item.active {
      background: rgba(120,103,245,0.10);
      color: var(--accent);
    }

    .fab {
      position: fixed;
      right: 18px;
      bottom: calc(94px + env(safe-area-inset-bottom));
      width: 60px;
      height: 60px;
      min-height: 60px;
      border-radius: 18px;
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 2rem;
      box-shadow: 0 18px 28px rgba(120,103,245,0.26);
      z-index: 52;
    }

    .sheet-backdrop, .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8,10,16,0.36);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      z-index: 60;
    }
    .sheet-backdrop.open, .modal-backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: min(760px, calc(100% - 18px));
      max-height: 86vh;
      transform: translate(-50%, 105%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      overflow: auto;
      box-shadow: var(--shadow);
      padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
      transition: transform .25s ease;
      z-index: 61;
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet .grab {
      width: 52px;
      height: 5px;
      background: rgba(128,136,160,0.5);
      border-radius: 999px;
      margin: 0 auto 12px;
    }
    .sheet h3 {
      margin: 0 0 10px;
      letter-spacing: -0.04em;
      font-size: 1.4rem;
    }
    .sheet-row {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }
    .field {
      display: grid;
      gap: 8px;
    }
    .field label {
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      outline: none;
      resize: vertical;
    }
    .field textarea { min-height: 96px; }
    .sheet-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .modal {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(440px, calc(100% - 20px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 20px 18px;
      z-index: 65;
      opacity: 0;
      transform: translate(-50%, -48%);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%);
    }
    .modal h4 {
      margin: 0 0 12px;
      font-size: 1.15rem;
      letter-spacing: -0.04em;
    }
    .modal p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }
    .menu-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    .menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: left;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .theme-card {
      display: grid;
      gap: 8px;
      text-align: left;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .theme-swatch {
      display: flex;
      height: 26px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .theme-swatch span { flex: 1; display: block; }

    @media (min-width: 640px) {
      .page { padding-top: 24px; }
      .mini-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    }
    @media (max-width: 420px) {
      .toolbar { gap: 6px; }
      .search-wrap { width: 150px; }
      .week-strip { gap: 6px; }
      .day-chip { min-height: 72px; }
      .mini-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .fab { right: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <h1>Itinerario Canvas</h1>
      </div>
      <div class="toolbar">
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Buscar" aria-label="Buscar" />
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema">☼</button>
      </div>
    </div>
  </header>

  <main id="main" class="page safe-pad" aria-live="polite"></main>

  <nav class="nav" aria-label="Navegación principal">
    <div id="nav" class="nav-inner"></div>
  </nav>

  <button id="fab" class="fab" aria-label="Añadir nuevo elemento">＋</button>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <aside id="sheet" class="sheet" aria-modal="true" role="dialog"></aside>

  <div id="modalBackdrop" class="modal-backdrop"></div>
  <div id="modal" class="modal" role="dialog" aria-modal="true"></div>

  <script>
    const STORAGE_KEY = 'itcanvas.cosmic.v2';
    const app = document.getElementById('main');
    const nav = document.getElementById('nav');
    const sheet = document.getElementById('sheet');
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const modal = document.getElementById('modal');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const searchInput = document.getElementById('searchInput');
    const themeToggleBtn = document.getElementById('themeToggle');
    const fab = document.getElementById('fab');

    const THEMES = {
      nebula: { name: 'Nebula', bg: '#f6f8ff', surface: '#ffffff', text: '#17192b', accent: '#7867f5', accent2:'#527bff', accent3:'#54d8e8', success:'#67d9ae', warning:'#ffbf69', danger:'#ff758b', dark: false },
      midnight: { name: 'Midnight', bg: '#0d1220', surface: '#141d2d', text: '#edf3ff', accent: '#8c90ff', accent2:'#6aa2ff', accent3:'#6fe4ff', success:'#81f0bc', warning:'#ffcc7c', danger:'#ff92a5', dark: true },
      aurora: { name: 'Aurora', bg: '#edfaf8', surface: '#ffffff', text: '#1b2636', accent: '#2db7b0', accent2:'#6fcc87', accent3:'#88e0c5', success:'#69d9ac', warning:'#ffbf69', danger:'#ff7a8b', dark: false },

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }
    function addDays(dateStr, offset) {
      const d = new Date(dateStr + 'T12:00:00');
      d.setDate(d.getDate() + offset);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }
    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    }
    function clamp(n, min, max) { return Math.min(Math.max(n, min), max); }

    function currentState() {
      return {

      };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return currentState();
        const saved = JSON.parse(raw);
        const base = currentState();
        return {
          ...base,
          ...saved,
          settings: { ...base.settings, ...(saved.settings || {}) },
          ui: { ...base.ui, ...(saved.ui || {}) },
          tasks: Array.isArray(saved.tasks) ? saved.tasks : base.tasks,
          projects: Array.isArray(saved.projects) ? saved.projects : base.projects,
          notes: Array.isArray(saved.notes) ? saved.notes : base.notes,
          events: Array.isArray(saved.events) ? saved.events : base.events,
          subjects: Array.isArray(saved.subjects) ? saved.subjects : base.subjects,
          inventory: Array.isArray(saved.inventory) ? saved.inventory : base.inventory,
          ledger: Array.isArray(saved.ledger) ? saved.ledger : base.ledger
        };
      } catch (error) {
        console.warn('Storage failed to parse, resetting demo dataset.', error);
        return currentState();
      }
    }

    let state = loadState();
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (error) { console.warn('Cannot save state.', error); }
    }
    function getSubject(subjectId) {
      return state.subjects.find(s => s.id === subjectId) || { id: subjectId, name: 'Sin materia', color: '#7d8498' };
    }
    function getThemeConfig() {
      const theme = THEMES[state.settings.theme] || THEMES.nebula;
      const dark = state.settings.mode === 'dark' || theme.dark;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.setProperty('--bg', theme.bg);
      document.documentElement.style.setProperty('--surface', theme.surface);
      document.documentElement.style.setProperty('--text', theme.text);
      document.documentElement.style.setProperty('--accent', theme.accent);
      document.documentElement.style.setProperty('--accent-2', theme.accent2);
      document.documentElement.style.setProperty('--accent-3', theme.accent3);
      document.documentElement.style.setProperty('--success', theme.success);
      document.documentElement.style.setProperty('--warning', theme.warning);
      document.documentElement.style.setProperty('--danger', theme.danger);
      document.documentElement.style.setProperty('--hero', `linear-gradient(135deg, ${theme.accent}22, ${theme.accent2}22, ${theme.accent3}15)`);
      return theme;
    }
    function formatDate(dateStr) {
      if (!dateStr) return 'Sin fecha';
      const date = new Date(`${dateStr}T12:00:00`);
      return date.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    function weekDates() {
      const selected = state.ui.selectedDay || todayStr();
      const today = new Date(`${selected}T12:00:00`);
      const day = (today.getDay() + 6) % 7;
      const monday = new Date(today);
      monday.setDate(today.getDate() - day + state.ui.weekOffset * 7);
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const dayNum = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${dayNum}`;
      });
    }
    function priorityClass(priority) {
      if (priority === 'high') return 'high';
      if (priority === 'medium') return 'medium';
      return 'low';
    }

    function renderHero() {
      const today = new Date();
      const greeting = today.getHours() < 12 ? 'Buenos días' : today.getHours() < 19 ? 'Buenas tardes' : 'Buenas noches';
      const completed = state.tasks.filter(t => t.done).length;
      const pending = state.tasks.filter(t => !t.done).length;
      const percent = state.tasks.length ? Math.round((completed / state.tasks.length) * 100) : 0;
      return `
        <section class="card hero">
          <div class="title-row">
            <div>
              <div class="eyebrow">${greeting}</div>
              <h2>${escapeHtml(state.pet?.name || 'Estudiante')}</h2>
            </div>
            <div class="pill">⚡ Nivel ${state.pet?.level || 1}</div>
          </div>
          <div class="meta">
            <span>🔥 Racha ${state.streak || 0} días</span>
            <span>•</span>
            <span>${state.xp || 0} XP acumulados</span>
          </div>
          <div class="progress-wrap">
            <div class="progress-head"><span>Progreso del día</span><strong>${percent}%</strong></div>
            <div class="progress-bar"><span style="width:${percent}%"></span></div>
          </div>
          <div class="mini-grid">
            <div class="stat"><span>Hechas</span><strong>${completed}</strong><small>${pending} pendientes</small></div>
            <div class="stat"><span>Proyectos</span><strong>${state.projects.length}</strong><small>${state.projects.filter(p => p.progress >= 100).length} cerrados</small></div>
            <div class="stat"><span>Notas</span><strong>${state.notes.length}</strong><small>Espacio creativo</small></div>
          </div>
        </section>
      `;
    }
    function renderWeekStrip() {
      const dates = weekDates();
      const selected = state.ui.selectedDay || todayStr();
      return `
        <div class="week-strip">
          ${dates.map(date => {
            const d = new Date(`${date}T12:00:00`);
            const label = d.toLocaleDateString('es-MX', { weekday: 'short' });
            const cellTasks = state.tasks.filter(task => task.due === date).length;
            const active = date === selected ? 'active' : '';
            return `
              <button class="day-chip ${active}" data-action="select-day" data-day="${date}">
                <span class="label">${escapeHtml(label)}</span>
                <span class="date">${d.getDate()}</span>
                <span class="dot-row">${Array.from({ length: clamp(cellTasks, 0, 3) }, () => '<span class="dot"></span>').join('')}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }
    function renderTaskItem(task) {
      const subject = getSubject(task.subject);
      const due = task.due ? formatDate(task.due) : 'Sin fecha';
      return `
        <div class="task-item ${task.done ? 'done' : ''}" data-task-id="${task.id}">
          <button class="check" data-action="toggle-task" data-id="${task.id}" aria-label="Marcar tarea como ${task.done ? 'pendiente' : 'completa'}">${task.done ? '✓' : ''}</button>
          <div class="task-main">
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-meta">
              <span class="badge subject" style="background:${subject.color}22;color:${subject.color};border-color:${subject.color}35;">${escapeHtml(subject.name)}</span>
              <span class="badge priority ${priorityClass(task.priority)}">${task.priority === 'high' ? 'Alta' : task.priority === 'medium' ? 'Media' : 'Baja'}</span>
              <span>${escapeHtml(due)}</span>
              <span>+${task.xp} XP</span>
            </div>
          </div>
          <div class="task-actions">
            <button class="mini" data-action="edit-task" data-id="${task.id}" aria-label="Editar tarea">✎</button>
            <button class="mini" data-action="delete-task" data-id="${task.id}" aria-label="Eliminar tarea">✕</button>
          </div>
        </div>
      `;
    }
    function renderTasks() {
      const filter = state.ui.filter || 'all';
      let tasks = [...state.tasks];
      if (filter === 'pending') tasks = tasks.filter(t => !t.done);
      if (filter === 'done') tasks = tasks.filter(t => t.done);
      if (filter === 'overdue') tasks = tasks.filter(t => !t.done && t.due && t.due < todayStr());
      if (state.ui.search) {
        const q = state.ui.search.toLowerCase();
        tasks = tasks.filter(t => `${t.title} ${getSubject(t.subject).name}`.toLowerCase().includes(q));
      }
      tasks = tasks.sort((a,b) => (a.done === b.done ? 0 : a.done ? 1 : -1) || (a.due || '9999-12-31').localeCompare(b.due || '9999-12-31'));
      return `
        <section class="card">
          <div class="subhead">
            <h3>Tareas</h3>
            <button class="link-btn" data-action="open-task-form">+ Nueva</button>
          </div>
          <div class="task-list">
            ${tasks.length ? tasks.map(renderTaskItem).join('') : '<div class="empty-state">No hay tareas con este filtro. Crea una nueva para empezar.</div>'}
          </div>
        </section>
      `;
    }

                    <h4>${escapeHtml(p.name)}</h4>
                  </div>
                  <span class="badge" style="background:${getSubject(p.subject).color}18;color:${getSubject(p.subject).color};">${escapeHtml(getSubject(p.subject).name)}</span>
                </div>
                <p>${escapeHtml(p.description || 'Sin descripción')}</p>
                <div class="progress-wrap" style="margin-top:0;">

          </div>

    function renderNotes() {
      return `

    function renderContent() {

    function openNoteForm() {
      openSheet('Nueva nota', `
        <div class="field"><label>Título</label><input id="note-title" value="" /></div>
        <div class="field"><label>Contenido</label><textarea id="note-text"></textarea></div>
        <div class="field"><label>Color</label><input id="note-color" type="color" value="#fff3a8" /></div>
      `, { sheet: 'note' });
    }
    function saveTaskFromSheet() {
      const taskId = sheet.querySelector('[data-sheet="task"]')?.dataset.taskId || uid('task');
      const task = state.tasks.find(t => t.id === taskId) || { id: taskId, done: false };
      task.title = document.getElementById('task-title').value.trim();
      task.subject = document.getElementById('task-subject').value;
      task.due = document.getElementById('task-due').value || todayStr();
      task.priority = document.getElementById('task-priority').value;
      task.xp = Number(document.getElementById('task-xp').value) || 10;
      if (!state.tasks.some(t => t.id === task.id)) state.tasks.push(task);
      saveState();
      renderContent();
      closeSheet();
    }
    function saveProjectFromSheet() {
      const projectId = sheet.querySelector('[data-sheet="project"]')?.dataset.projectId || uid('project');
      const project = state.projects.find(p => p.id === projectId) || { id: projectId };
      project.name = document.getElementById('project-name').value.trim();
      project.subject = document.getElementById('project-subject').value;
      project.due = document.getElementById('project-due').value || addDays(todayStr(), 7);
      project.description = document.getElementById('project-description').value.trim();
      project.progress = Number(document.getElementById('project-progress').value) || 0;
      if (!state.projects.some(p => p.id === project.id)) state.projects.push(project);
      saveState();
      renderContent();
      closeSheet();
    }
    function saveNoteFromSheet() {
      const note = {
        id: uid('note'),
        title: document.getElementById('note-title').value.trim() || 'Nota',
        text: document.getElementById('note-text').value.trim() || 'Escribe algo útil…',
        color: document.getElementById('note-color').value || '#fff3a8',
        created: Date.now()
      };
      state.notes.push(note);
      saveState();
      renderContent();
      closeSheet();
    }
    function deleteTask(id) {
      openModal('Eliminar tarea', '¿Deseas quitar esta tarea? La acción no borra el historial de XP ya obtenido.', [
        { label: 'Cancelar', name: 'close-modal', primary: false },
        { label: 'Eliminar', name: 'confirm-delete-task', primary: true, id }
      ]);
    }
    function handleAction(actionName, target) {
      if (actionName === 'switch-tab') {
        state.ui.tab = target.dataset.tab;
        saveState();
        renderContent();
      }
      if (actionName === 'select-day') {
        state.ui.selectedDay = target.dataset.day;
        saveState();
        renderContent();
      }
      if (actionName === 'week-back') {
        state.ui.weekOffset -= 1;
        renderContent();
      }
      if (actionName === 'week-forward') {
        state.ui.weekOffset += 1;
        renderContent();
      }
      if (actionName === 'open-task-form') openTaskForm();
      if (actionName === 'edit-task') openTaskForm(target.dataset.id);
      if (actionName === 'delete-task') deleteTask(target.dataset.id);
      if (actionName === 'toggle-task') {
        const task = state.tasks.find(t => t.id === target.dataset.id);
        if (!task) return;
        task.done = !task.done;
        state.xp += task.done ? task.xp : -task.xp;
        state.streak = Math.max(0, state.streak + (task.done ? 1 : -1));
        saveState();
        renderContent();
      }
      if (actionName === 'open-project-form') openProjectForm();
      if (actionName === 'open-note-form') openNoteForm();
      if (actionName === 'close-sheet') closeSheet();
      if (actionName === 'close-modal') closeModal();
      if (actionName === 'confirm-delete-task') {
        state.tasks = state.tasks.filter(t => t.id !== target.dataset.id);
        closeModal();
        saveState();
        renderContent();
      }
      if (actionName === 'save-sheet') {
        const type = sheet.querySelector('[data-sheet]')?.dataset.sheet;
        if (type === 'task') saveTaskFromSheet();
        if (type === 'project') saveProjectFromSheet();
        if (type === 'note') saveNoteFromSheet();
      }
      if (actionName === 'set-theme') {
        state.settings.theme = target.dataset.theme;
        state.settings.mode = THEMES[target.dataset.theme].dark ? 'dark' : 'light';
        saveState();
        renderContent();
      }
    }

    document.body.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      handleAction(target.dataset.action, target);
    });
    searchInput.addEventListener('input', (event) => {
      state.ui.search = event.target.value;
      renderContent();
    });
    themeToggleBtn.addEventListener('click', () => {
      const keys = Object.keys(THEMES);
      const currentIndex = keys.indexOf(state.settings.theme);
      const next = keys[(currentIndex + 1) % keys.length];
      state.settings.theme = next;
      state.settings.mode = THEMES[next].dark ? 'dark' : 'light';
      saveState();
      renderContent();
    });
    fab.addEventListener('click', () => {
      openSheet('Crear rápido', `
        <div class="menu-grid">
          <button class="menu-btn" data-action="open-task-form"><span>Tarea</span><span>＋</span></button>
          <button class="menu-btn" data-action="open-project-form"><span>Proyecto</span><span>▣</span></button>
          <button class="menu-btn" data-action="open-note-form"><span>Nota</span><span>✎</span></button>
        </div>
      `, { sheet: 'menu' });
    });
    sheetBackdrop.addEventListener('click', closeSheet);
    modalBackdrop.addEventListener('click', closeModal);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (sheet.classList.contains('open')) closeSheet();
        else if (modal.classList.contains('open')) closeModal();
      }
    });

    function init() {
      getThemeConfig();
      renderContent();
      saveState();
    }
    init();
  </script>
</body>
</html>
